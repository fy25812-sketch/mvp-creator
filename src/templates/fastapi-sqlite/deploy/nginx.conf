# {{PROJECT_NAME}} — host nginx vhost (rendered by MVP Creator on {{GENERATED_AT}})
#
# Install to /etc/nginx/conf.d/{{CONTAINER_NAME}}.conf
#
# This file assumes the TLS certificate already exists. On a brand-new server
# there is nothing on port 443 yet, so nginx would refuse to start:
#
#   1. point the DNS A record of {{DOMAIN}} at the server  (see deploy/https.md)
#   2. run  sudo bash deploy/init-letsencrypt.sh          (installs a temporary
#      HTTP-only vhost, issues the certificate, then copies this file into place)
#
# Renewal is handled by deploy/init-letsencrypt.sh / the cron entry in https.md.
# After a renewal only `nginx -s reload` is needed; the container is untouched.

server {
    listen      80;
    listen      [::]:80;
    server_name {{DOMAIN}};

    # ACME HTTP-01 challenge. Kept on port 80 so certbot --webroot can work
    # without touching the TLS vhost.
    location /.well-known/acme-challenge/ {
        root         /var/www/certbot;
        default_type "text/plain";
        access_log   off;
    }

    # Health probe for external uptime monitors (plain HTTP, no redirect).
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:{{APP_PORT}};
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` works on every nginx >= 1.9.5. On nginx >= 1.25.1 it
    # logs a deprecation notice; if you run a newer build, replace the two lines
    # below with `listen 443 ssl;` plus a standalone `http2 on;` directive.
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;

    server_name {{DOMAIN}};

    # --- TLS ---------------------------------------------------------------
    ssl_certificate           /etc/letsencrypt/live/{{DOMAIN}}/fullchain.pem;
    ssl_certificate_key       /etc/letsencrypt/live/{{DOMAIN}}/privkey.pem;
    ssl_trusted_certificate   /etc/letsencrypt/live/{{DOMAIN}}/chain.pem;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # --- hardening ---------------------------------------------------------
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 8m;

    # --- compression -------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   512;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss image/svg+xml;

    # --- proxy -------------------------------------------------------------
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:{{APP_PORT}};
        proxy_set_header Host $host;
    }

    # Static assets are served by the app but cached at the edge. They are the
    # only paths where a long max-age is safe (the HTML page is never cached).
    location ~* \.(?:css|js|mjs|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|map)$ {
        proxy_pass http://127.0.0.1:{{APP_PORT}};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:{{APP_PORT}};
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_redirect        off;

        # Server-rendered HTML: never cache the application itself.
        add_header Cache-Control "no-store" always;
    }
}
